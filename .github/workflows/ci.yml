name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: shell and Perl tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Run Bash and Perl test suites
        run: make test
