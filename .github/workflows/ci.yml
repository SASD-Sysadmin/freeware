name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: shell and Perl tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Run Bash and Perl test suites
        run: make test
      - name: Install optional integration clients (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dnsutils ldap-utils openssl shellcheck
      - name: ShellCheck Bash sources (Ubuntu)
        if: runner.os == 'Linux'
        run: make shellcheck
      - name: Run loopback DNS and LDAPS integration checks
        env:
          SASD_REQUIRE_DNS_INTEGRATION: '1'
          SASD_REQUIRE_LDAP_INTEGRATION: ${{ runner.os == 'Linux' && '1' || '0' }}
          SASD_SKIP_LDAP_INTEGRATION: ${{ runner.os == 'macOS' && '1' || '0' }}
        run: make integration-test
      - name: Check staged installation and removal
        shell: bash
        run: |
          set -euo pipefail
          staging="$(mktemp -d)"
          trap 'rm -rf "$staging"' EXIT
          make install DESTDIR="$staging" PREFIX=/usr/freeware
          test -f "$staging/usr/freeware/.sasd-freeware-install.tsv"
          make install DESTDIR="$staging" PREFIX=/usr/freeware
          test -x "$staging/usr/freeware/bin/account-inventory"
          test -x "$staging/usr/freeware/bin/session-report"
          test -x "$staging/usr/freeware/bin/process-report"
          test -x "$staging/usr/freeware/bin/login-audit"
          test -f "$staging/usr/freeware/man/man1/login-audit.1"
          test -x "$staging/usr/freeware/bin/db-probe"
          test -f "$staging/usr/freeware/docs/commands/db-probe.de.md"
          test -f "$staging/usr/freeware/man/man1/db-probe.1"
          test -x "$staging/usr/freeware/bin/db-health"
          test -f "$staging/usr/freeware/docs/commands/db-health.de.md"
          test -f "$staging/usr/freeware/man/man1/db-health.1"
          test -x "$staging/usr/freeware/bin/db-activity"
          test -f "$staging/usr/freeware/docs/commands/db-activity.de.md"
          test -f "$staging/usr/freeware/man/man1/db-activity.1"
          test -x "$staging/usr/freeware/bin/db-storage"
          test -f "$staging/usr/freeware/docs/commands/db-storage.de.md"
          test -f "$staging/usr/freeware/man/man1/db-storage.1"
          test -x "$staging/usr/freeware/bin/home-audit"
          test -x "$staging/usr/freeware/bin/nss-lookup"
          test -x "$staging/usr/freeware/bin/host-resolve"
          test -x "$staging/usr/freeware/bin/ldap-probe"
          test -x "$staging/usr/freeware/bin/nsswitch-audit"
          test -x "$staging/usr/freeware/bin/dns-query"
          test -x "$staging/usr/freeware/bin/nis-probe"
          test -x "$staging/usr/freeware/bin/ldap-config-audit"
          test -f "$staging/usr/freeware/docs/commands/dns-query.de.md"
          test -f "$staging/usr/freeware/man/man1/nis-probe.1"
          test -f "$staging/usr/freeware/man/man1/nss-lookup.1"
          test -f "$staging/usr/freeware/docs/commands/ldap-probe.de.md"
          test -f "$staging/usr/freeware/docs/PLATFORMS.md"
          test -f "$staging/usr/freeware/docs/PLATFORMS.de.md"
          test -f "$staging/usr/freeware/docs/TESTING.md"
          test -f "$staging/usr/freeware/docs/TESTING.de.md"
          test -f "$staging/usr/freeware/docs/EXIT-CODES.md"
          test -f "$staging/usr/freeware/docs/EXIT-CODES.de.md"
          test -f "$staging/usr/freeware/docs/PRIVILEGED-SAFETY.md"
          test -f "$staging/usr/freeware/docs/PRIVILEGED-SAFETY.de.md"
          test -f "$staging/usr/freeware/man/man8/account-manage.8"
          make uninstall DESTDIR="$staging" PREFIX=/usr/freeware
          test ! -e "$staging/usr/freeware/.sasd-freeware-install.tsv"
          test ! -e "$staging/usr/freeware/bin/account-inventory"
          test ! -e "$staging/usr/freeware/bin/db-probe"
          test ! -e "$staging/usr/freeware/man/man1/db-probe.1"
          test ! -e "$staging/usr/freeware/bin/db-health"
          test ! -e "$staging/usr/freeware/man/man1/db-health.1"
          test ! -e "$staging/usr/freeware/bin/db-activity"
          test ! -e "$staging/usr/freeware/man/man1/db-activity.1"
          test ! -e "$staging/usr/freeware/bin/db-storage"
          test ! -e "$staging/usr/freeware/man/man1/db-storage.1"
          test ! -e "$staging/usr/freeware/bin/nss-lookup"
          test ! -e "$staging/usr/freeware/bin/host-resolve"
          test ! -e "$staging/usr/freeware/bin/ldap-probe"
          test ! -e "$staging/usr/freeware/bin/nsswitch-audit"
          test ! -e "$staging/usr/freeware/bin/dns-query"
          test ! -e "$staging/usr/freeware/bin/nis-probe"
          test ! -e "$staging/usr/freeware/bin/ldap-config-audit"
          test ! -e "$staging/usr/freeware/docs/commands/dns-query.de.md"
          test ! -e "$staging/usr/freeware/docs/commands/ldap-probe.de.md"
          test ! -e "$staging/usr/freeware/docs/PLATFORMS.md"
          test ! -e "$staging/usr/freeware/docs/TESTING.md"
          test ! -e "$staging/usr/freeware/docs/EXIT-CODES.de.md"
          test ! -e "$staging/usr/freeware/docs/PRIVILEGED-SAFETY.md"
          test ! -e "$staging/usr/freeware/docs/PRIVILEGED-SAFETY.de.md"
